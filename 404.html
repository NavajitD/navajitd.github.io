<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Navajit D</title>
    <meta name="robots" content="noindex">
    <script>
        // Each post has a static page, /blog/<slug>.html, made when the site
        // deploys. A post published since then has none yet: open it from
        // Firestore instead. /blog/ itself is the blog.
        (function () {
            var path = location.pathname;
            if (/^\/blog\/?$/.test(path)) return location.replace('/blog.html');
            var m = path.match(/^\/blog\/([a-z0-9]+(?:-[a-z0-9]+)*)(?:\.html)?\/?$/i);
            if (m) location.replace('/blog-post.html?id=' + encodeURIComponent(m[1].toLowerCase()) + '&live' + location.hash);
        })();
    </script>
