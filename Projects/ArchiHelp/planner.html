    <style>
        :root {
            --ink: #0a1f00; --ink-2: #374151; --muted: #6b7280; --faint: #9ca3af;
            --bg: #ffffff; --panel: #f9fafb; --panel-2: #f3f4f6; --line: #e5e7eb; --line-2: #d1d5db;
            --accent: #2563eb; --accent-ink: #1d4ed8; --accent-soft: rgba(37, 99, 235, 0.08);
            --ok: #047857; --ok-bg: #ecfdf5; --bad: #b91c1c; --bad-bg: #fef2f2; --adv: #92400e; --adv-bg: #fffbeb;
            --font: "Inconsolata", ui-monospace, SFMono-Regular, Menlo, monospace;
            --radius: 6px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.06);
            --top-h: 52px;
            --sub-h: 0px;
            --chrome-h: calc(var(--top-h) + var(--sub-h));
        }
        body { --chrome-h: calc(var(--top-h) + var(--sub-h)); }   /* resolved on body, where has-sub sets --sub-h */
        body.has-sub { --sub-h: 44px; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
        button, input, select, textarea { font: inherit; color: inherit; }
        a { color: var(--accent); }
        [hidden] { display: none !important; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- top bar ---------- */
        .topbar { height: var(--top-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 30; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .01em; text-decoration: none; color: var(--ink); white-space: nowrap; }
        .brand svg { width: 22px; height: 22px; }
        .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
        .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
        .crumbs .sep { color: var(--faint); }
        .crumbs .cur { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
        .topbar .spacer { flex: 1; }
        .tabs { display: flex; align-self: stretch; gap: 2px; margin-left: 6px; }
        .tabs a { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
        .tabs a:hover { color: var(--ink); background: var(--panel); }
        .tabs a.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
        .tabs .ticon { display: inline-flex; }
        .tabs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
        .tabs .short { display: none; }
        .subbar { height: var(--sub-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: var(--top-h); z-index: 29; overflow-x: auto; overflow-y: hidden; white-space: nowrap; }
        .subbar .sb-name { font-weight: 700; color: var(--ink); text-decoration: none; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; display: block; }
        .subbar .sb-name:hover { color: var(--accent-ink); }
        .floortabs { display: flex; gap: 6px; align-items: center; }
        .ftab { height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 15px; background: var(--bg); cursor: pointer; font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        .ftab:hover { border-color: var(--faint); }
        .ftab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ftab small { font-size: 11px; opacity: .75; }
        .ftab.add { border-style: dashed; color: var(--muted); }
        .ftab.ghost { border-color: transparent; background: transparent; color: var(--muted); width: 30px; padding: 0; justify-content: center; font-size: 17px; }
        .ftab.ghost:hover { color: var(--bad); background: var(--bad-bg); }
        .subbar .crumbs { margin-left: auto; }
        .grid1 { display: grid; gap: 14px; }
        .topbar .site-link { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
        .topbar .site-link:hover { color: var(--ink); }

        /* ---------- controls ---------- */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg); cursor: pointer; white-space: nowrap; font-weight: 500; transition: background .12s, border-color .12s; text-decoration: none; color: var(--ink); }
        .btn:hover { background: var(--panel); border-color: var(--faint); }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-ink); }
        .btn.ghost { border-color: transparent; background: transparent; }
        .btn.ghost:hover { background: var(--panel-2); }
        .btn.sm { height: 28px; padding: 0 10px; font-size: 13.5px; }
        .btn.danger { color: var(--bad); }
        .btn.icon { width: 34px; padding: 0; }
        .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .field { display: grid; gap: 4px; align-content: start; }
        .field > span { font-size: 13px; color: var(--muted); }
        .field > .seg, .field > .row { justify-self: start; max-width: 100%; }
        .seg { flex-wrap: wrap; }
        .field > small { font-size: 12.5px; color: var(--faint); }
        input[type=text], input[type=number], input[type=search], input[type=date], select, textarea, .ftin { height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg); width: 100%; min-width: 0; }
        textarea { height: auto; padding: 8px 10px; resize: vertical; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
        input.bad { border-color: var(--bad); }
        /* the frame is an inset shadow, so the selected segment fills the full 34px like a .btn next to it */
        .seg { display: inline-flex; border-radius: var(--radius); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--bg); }
        .seg button { border: 0; background: transparent; padding: 0 12px; height: 34px; cursor: pointer; box-shadow: inset -1px 0 0 var(--line); }
        .seg button:last-child { box-shadow: none; }
        .seg button:hover:not(.on) { background: var(--panel); }
        .seg button.on { background: var(--accent); color: #fff; box-shadow: none; }
        .check.chip { height: 34px; align-items: center; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg); white-space: nowrap; }
        .check.chip input { margin: 0; }
        .check.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
        .dd-wrap { position: relative; display: inline-flex; }
        .btn.dd { gap: 8px; }
        .btn.dd .dd-lbl { color: var(--muted); font-weight: 400; }
        .btn.dd .dd-caret { width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); margin-left: 4px; opacity: .65; }
        .btn.dd[aria-expanded=true] { border-color: var(--accent); }
        .dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 45; min-width: 100%; width: max-content; max-width: min(360px, calc(100vw - 24px)); background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(15, 23, 42, .14); padding: 4px; display: grid; gap: 1px; }
        .dd-menu.right { left: auto; right: 0; }
        .dd-menu button { display: grid; gap: 1px; text-align: left; border: 0; background: none; padding: 7px 12px 7px 30px; border-radius: 5px; cursor: pointer; position: relative; }
        .dd-menu button:hover, .dd-menu button:focus-visible { background: var(--panel-2); outline: none; }
        .dd-menu button.on::before { content: ''; position: absolute; left: 12px; top: 12px; width: 5px; height: 9px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); }
        .dd-menu button b { font-weight: 600; font-size: 14px; }
        .dd-menu button.on b { color: var(--accent-ink); }
        .dd-menu button span { color: var(--muted); font-size: 12.5px; white-space: normal; }
        .check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
        .check input { margin-top: 3px; accent-color: var(--accent); }
        .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
        .badge.ok { color: var(--ok); background: var(--ok-bg); } .badge.bad { color: var(--bad); background: var(--bad-bg); } .badge.adv { color: var(--adv); background: var(--adv-bg); }
        .badge.plain { color: var(--ink-2); background: var(--panel-2); }
        .muted { color: var(--muted); } .small { font-size: 13px; }
        .num { font-variant-numeric: tabular-nums; }
        h1, h2, h3 { margin: 0; line-height: 1.2; }

        /* ---------- screens ---------- */
        .screen { min-height: calc(100vh - var(--chrome-h)); }

        /* home */
        .home { max-width: 1080px; margin: 0 auto; padding: 36px 20px 60px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 40px; }
        .home h1 { font-size: 26px; margin-bottom: 8px; }
        .home .lede { color: var(--ink-2); margin: 0 0 22px; max-width: 46ch; }
        .start { display: grid; gap: 12px; }
        .start .opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); cursor: pointer; text-align: left; }
        .start .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
        .start .opt b { font-size: 15.5px; }
        .start .opt span { grid-column: 1; color: var(--muted); font-size: 13.5px; }
        .start .opt i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; color: var(--accent); font-size: 20px; }
        .how { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }
        .how ol { padding-left: 20px; margin: 8px 0 0; display: grid; gap: 4px; }
        .projects h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }
        .plist { display: grid; gap: 10px; }
        .pcard { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
        .pcard .thumb { width: 120px; height: 72px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; display: grid; place-items: center; }
        .pcard .thumb svg { width: 100%; height: 100%; }
        .pcard h3 { font-size: 15.5px; margin-bottom: 2px; }
        .pcard .meta { color: var(--muted); font-size: 13px; }
        .pcard .row { margin-top: 8px; }
        .empty { padding: 26px; border: 1px dashed var(--line-2); border-radius: var(--radius); color: var(--muted); text-align: center; }

        /* wizard */
        .wz { display: grid; grid-template-columns: 210px minmax(0, 1fr) 380px; min-height: calc(100vh - var(--chrome-h)); }
        .wz-steps { border-right: 1px solid var(--line); padding: 20px 0; background: var(--panel); }
        .wz-steps ol { list-style: none; margin: 0; padding: 0; }
        .wz-steps li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 18px; cursor: pointer; display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
        .wz-steps li button .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 12.5px; flex: none; background: var(--bg); }
        .wz-steps li button.on { color: var(--ink); font-weight: 700; background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
        .wz-steps li button.on .n { border-color: var(--accent); background: var(--accent); color: #fff; }
        .wz-steps li button.done .n { border-color: var(--ok); color: var(--ok); }
        .wz-main { padding: 26px 32px 40px; max-width: 860px; }
        .wz-main h2 { font-size: 21px; margin-bottom: 6px; }
        .wz-main .intro { color: var(--ink-2); margin: 0 0 20px; max-width: 70ch; }
        .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
        .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
        .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; }
        fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; margin: 0 0 18px; }
        legend { padding: 0 6px; font-weight: 700; font-size: 14px; }
        details.adv { border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 18px; }
        details.adv > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
        details.adv > summary::after { content: "+"; color: var(--muted); }
        details.adv[open] > summary::after { content: "–"; }
        details.adv > div { padding: 2px 16px 16px; }
        .counter { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
        .counter .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--radius); }
        .counter .stepper button { width: 30px; height: 30px; border: 0; background: var(--bg); cursor: pointer; font-size: 17px; }
        .counter .stepper output { min-width: 28px; text-align: center; font-weight: 700; }
        .wz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
        .wz-side { border-left: 1px solid var(--line); padding: 20px; background: var(--panel); display: grid; align-content: start; gap: 16px; position: sticky; top: var(--chrome-h); max-height: calc(100vh - var(--chrome-h)); overflow: auto; }
        .wz-side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
        .preview { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); }
        .preview svg { width: 100%; height: auto; display: block; }
        .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; }
        .facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; }
        .note { font-size: 13.5px; padding: 10px 12px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line); }
        .note.bad { border-color: #fecaca; background: var(--bad-bg); color: var(--bad); }
        .note.ok { border-color: #a7f3d0; background: var(--ok-bg); color: var(--ok); }
        table.rules { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        table.rules th, table.rules td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: middle; }
        table.rules th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
        table.rules input { height: 30px; }
        .rules-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
        .padas { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
        .padas button { height: 24px; border: 1px solid var(--line-2); border-radius: 3px; background: var(--bg); font-size: 11.5px; cursor: pointer; padding: 0; }
        .padas button.t1 { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
        .padas button.t2 { background: #93c5fd; border-color: #93c5fd; }

        /* catalogue */
        .cat { max-width: 1320px; margin: 0 auto; padding: 22px 20px 60px; }
        .cat-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
        .cat-head h1 { font-size: 22px; }
        .cat-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; min-height: 34px; }
        .cat-bar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
        .progress { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 10px; width: 320px; max-width: 100%; }
        .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .ccard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
        .ccard:hover { border-color: var(--faint); box-shadow: var(--shadow); }
        .ccard .pic { background: var(--panel); border-bottom: 1px solid var(--line); aspect-ratio: 16 / 8.5; display: grid; place-items: center; cursor: zoom-in; }
        .ccard .pic svg { width: 100%; height: 100%; }
        .ccard .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px 2px; }
        .ccard .hd b { min-width: 0; }
        .ccard .hd b { font-size: 15.5px; }
        .score { font-weight: 700; font-size: 20px; }
        .score small { font-size: 12.5px; color: var(--muted); font-weight: 500; }
        .ccard .stats { padding: 2px 12px 8px; display: grid; grid-template-columns: repeat(3, auto); gap: 2px 12px; font-size: 13px; color: var(--ink-2); }
        .ccard .ft { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; }
        .ccard .ft label { margin-right: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
        .cmp { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 12px; align-items: center; z-index: 20; box-shadow: 0 -4px 16px rgba(0,0,0,.05); }

        /* editor */
        .ed { display: grid; grid-template-columns: 56px minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr) 34px; height: calc(100vh - var(--chrome-h)); }
        .ed-tools { grid-row: 1 / span 2; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; background: var(--panel); }
        .tool { width: 42px; height: 42px; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); position: relative; }
        .tool:hover { background: var(--panel-2); }
        .tool.on { background: var(--bg); border-color: var(--accent); color: var(--accent-ink); }
        .tool svg { width: 20px; height: 20px; }
        .tool[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: 12.5px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 40; pointer-events: none; }
        .ed-tools hr { width: 28px; border: 0; border-top: 1px solid var(--line-2); margin: 6px 0; }
        .ed-canvas { position: relative; overflow: hidden; background: #fbfbfa; touch-action: none; }
        .ed-canvas > svg { width: 100%; height: 100%; display: block; user-select: none; }
        .ed-canvas.picking { cursor: crosshair; }

        .tr-room.t-court rect { fill: rgba(22, 163, 74, 0.14); stroke: #15803d; }

        .tr-op.on { stroke: #dc2626; stroke-width: 2px; vector-effect: non-scaling-stroke; }
        .tr-nowall { stroke: #f59e0b; stroke-linecap: round; opacity: .85; }

        .tr-sp { fill: #dc2626; } .tr-sl { stroke: #dc2626; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }

        }
