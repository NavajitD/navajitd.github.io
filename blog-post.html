    <!-- Every post has a static page, /blog/<slug>.html, built from this file
         when the site deploys (scripts/build-blog.mjs): it fills in the post
         and drops the parts marked @live. With them, this page reads a post
         from Firestore: one published since the last deploy, or the admin's
         preview. Old ?id= links go on to the static page. -->
    <script type="application/json" id="blogSlugs">{}</script>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <script>
        (function () {
            var q = new URLSearchParams(location.search);
            var s = window.__post = { id: q.get('id') || '', preview: q.has('preview') };
            if (!s.id || s.preview) return;
            // The deploy lists every post that has a static page (id → slug).
            if (!q.has('live')) {
                try {
                    var slug = JSON.parse(document.getElementById('blogSlugs').textContent)[s.id];
                    if (slug) { s.moved = true; location.replace('/blog/' + slug + '.html' + location.hash); return; }
                } catch (e) {}
            }
            var base = 'https://firestore.googleapis.com/v1/projects/recipes-7dc22/databases/(default)/documents/posts/' + encodeURIComponent(s.id) + '?key=AIzaSyCM8XiZ9tLn7jtVNcx0D6iZwYOGXBOLdjU';
            function get(fields, priority) {
                var p = fetch(base + fields.map(function (f) { return '&mask.fieldPaths=' + f; }).join(''), { priority: priority })
                    .then(function (r) { if (r.ok) return r.json(); var e = new Error('Firestore ' + r.status); e.status = r.status; throw e; });
                p.catch(function () {});
                return p;
            }
            s.text = get(['type', 'title', 'author', 'date', 'updatedAt', 'lang', 'excerpt', 'readTime', 'html', 'poem', 'note', 'description', 'cuisine', 'difficulty', 'prepTime', 'cookTime', 'servings', 'tags', 'ingredients', 'steps', 'notes', 'hasHero', 'galleryCount'], 'high');
            s.media = get(['media', 'heroImage', 'images'], 'low');
        })();
    </script>

        :root {
            --text: #1a1a1a; --text-secondary: #525252; --bg: #fff; --bg-subtle: #fafafa;

        *{box-sizing:border-box;margin:0;padding:0} html{font-size:18px;scroll-behavior:smooth}

        /* ─── Top Bar ────────────────────────────────── */
        .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);transition:box-shadow .2s}
        .topbar.scrolled{box-shadow:0 1px 8px rgba(0,0,0,.06)}
        .topbar-inner{max-width:var(--reading-width);margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
        .topbar-back{font-family:var(--font-mono);font-size:.8125rem;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:.375rem;transition:color .2s}
        .topbar-back:hover{color:var(--accent);text-decoration:none}
        .topbar-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
        .topbar-home{font-family:var(--font-mono);font-size:.8125rem;font-weight:600;color:var(--text);text-decoration:none}
        .topbar-home:hover{color:var(--accent);text-decoration:none}

        /* ─── Article ────────────────────────────────── */
        .article-container{max-width:var(--reading-width);margin:0 auto;padding:0 1.5rem}
        .article-header{padding:3.5rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:2.5rem}
        .article-title{font-family:var(--font-serif);font-size:2.25rem;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin-bottom:1rem;text-wrap:balance}
        .article-meta{font-family:var(--font-mono);font-size:.8125rem;color:var(--text-secondary);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        .article-meta-divider{width:3px;height:3px;border-radius:50%;background:var(--text-secondary);opacity:.5}
        .article-author{font-weight:600;color:var(--text)}
        .article-body{padding-bottom:3rem}

        /* Reset Google Docs inline styles */

        .article-body p{margin-bottom:1.5rem;font-size:1rem;line-height:1.8}

        .article-body h3{font-size:1.15rem;font-weight:600;margin:2rem 0 .75rem;line-height:1.4}
        .article-body h4,.article-body h5,.article-body h6{font-size:1rem;font-weight:600;margin:1.75rem 0 .625rem}

        .article-body a:hover{text-decoration-color:var(--accent)}
        .article-body strong,.article-body b{font-weight:700}
        .article-body em,.article-body i{font-style:italic}
        .article-body ul,.article-body ol{margin:0 0 1.5rem 1.5rem;line-height:1.8}
        .article-body li{margin-bottom:.375rem} .article-body li p{margin-bottom:.375rem}
        .article-body blockquote{border-left:3px solid var(--accent);padding:.25rem 0 .25rem 1.25rem;margin:1.75rem 0;color:var(--text-secondary);font-style:italic}
        .article-body blockquote p{margin-bottom:.5rem} .article-body blockquote p:last-child{margin-bottom:0}
        .article-body img{max-width:100%;height:auto;border-radius:6px;margin:1.5rem 0;display:block;background:var(--bg-subtle)}
        .article-body table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.9375rem}
        .article-body th,.article-body td{border:1px solid var(--border);padding:.625rem .875rem;text-align:left;line-height:1.5}
        .article-body th{background:var(--bg-subtle);font-weight:600}
        .article-body tr:hover td{background:rgba(0,0,0,.015)}
        .article-body code{font-family:var(--font-mono);font-size:.875em;background:var(--bg-subtle);padding:.15rem .4rem;border-radius:3px;border:1px solid var(--border)}

        .article-body.poem:lang(bn){font-family:"Tiro Bangla",var(--font-poem);font-size:1.125rem;line-height:1.85}
        .article-body.poem:lang(hi){font-family:"Tiro Devanagari Hindi",var(--font-poem);font-size:1.125rem;line-height:1.85}

        .poem-note{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);max-width:32rem;font-style:italic;color:var(--text-secondary)}
        .poem .poem-note p{font-size:1.0625rem;line-height:1.6;margin-bottom:.75rem}

        /* ─── Recipes ────────────────────────────────── */
        .recipe-facts{display:flex;flex-wrap:wrap;gap:.75rem 2rem;margin-top:1.5rem;font-family:var(--font-mono)}
        .recipe-facts dt{font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
        .recipe-facts dd{font-size:.9375rem;font-weight:600;font-variant-numeric:tabular-nums}
        .article-body .recipe-lead p{font-size:1.0625rem}
        .article-body .recipe-hero{margin:0 0 2.25rem}
        .article-body .recipe-hero img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;margin:0}
        .article-body.recipe h2{font-size:1.25rem;margin:2.25rem 0 .75rem}
        .article-body.recipe h3{font-size:1rem;margin:1.25rem 0 .25rem;color:var(--text-secondary)}
        .article-body .ingredients{list-style:none;margin:0 0 1rem}
        .article-body .ingredients li{margin:0;padding:.4rem 0;border-bottom:1px solid var(--border);line-height:1.6}
        .article-body .steps{list-style:none;margin:0 0 1.5rem;counter-reset:step}
        .article-body .steps li{counter-increment:step;position:relative;padding-left:2.5rem;margin-bottom:1rem}
        .article-body .steps li::before{content:counter(step);position:absolute;left:0;top:.2rem;width:1.625rem;height:1.625rem;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.75rem;font-weight:700;color:var(--accent)}
        .article-body .recipe-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem;margin:2rem 0}
        .article-body .recipe-gallery img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;margin:0;border-radius:4px}
        .recipe-tags{font-family:var(--font-mono) !important;font-size:.8125rem !important;color:var(--text-secondary)}

        /* ─── Footer (matches site nav) ──────────────── */
        .post-footer{max-width:var(--reading-width);margin:0 auto;padding:2rem 1.5rem 3rem;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:.875rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
        .footer-links{display:flex;gap:1.5rem}
        .footer-links a{color:var(--muted);text-decoration:none} .footer-links a:hover{color:var(--accent)}

        /* ─── States ─────────────────────────────────── */
        .loading-article{max-width:var(--reading-width);margin:0 auto;padding:4rem 1.5rem;text-align:center;font-family:var(--font-mono);color:var(--text-secondary);font-size:.875rem}
        .loading-article .spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
        .loading-article a{color:var(--accent)}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:640px){html{font-size:17px}.article-header{padding:2.5rem 0 1.5rem}.article-title{font-size:1.75rem}.is-poetry .article-title{font-size:1.875rem}.poem{font-size:1.1875rem}.article-container{padding:0 1rem}.topbar-inner{padding:.625rem 1rem}.post-footer{padding:2rem 1rem;flex-direction:column;gap:1rem;text-align:center}}
    </style>

<script type="module">
import { normalize, articleHtml, fromRest, docUrl, TEXT_FIELDS, MEDIA_FIELDS, mediaSources, describePost, jsonLd, ldJson, typeName } from '/blog-core.js?v=db4c4ef6';

const s = window.__post || {};
const $ = (id) => document.getElementById(id);

function show(post) {
    const p = normalize(post);
    const a = $('article');
    a.innerHTML = articleHtml(p);
    a.className = `article-container is-${p.type}`;
    a.hidden = false;
    $('loadingState').hidden = true;
    $('postFooter').hidden = false;
    describe(p);
}

// Title, description, canonical address (the static page) and structured data.
function describe(p) {
    const d = describePost(p);
    $('backLink').href = `/blog.html#${p.type}`;
    $('backLabel').textContent = typeName(p.type);
    document.title = d.pageTitle;
    for (const [sel, value] of [
        ['meta[name="description"]', d.description], ['meta[property="og:description"]', d.description], ['meta[name="twitter:description"]', d.description],
        ['meta[property="og:title"]', d.title], ['meta[name="twitter:title"]', d.title],
    ]) document.querySelector(sel)?.setAttribute('content', value);
    if (s.preview) return;
    let link = document.querySelector('link[rel="canonical"]');
    if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.append(link); }
    link.href = d.url;
    let ld = $('postLd');
    if (!ld) { ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.id = 'postLd'; document.head.append(ld); }
    ld.textContent = ldJson(jsonLd(p));
}

function fillMedia(m) {
    const src = mediaSources(m);
    for (const img of document.querySelectorAll('#article img[data-media]')) {
        const v = src[img.dataset.media];
        if (v && img.getAttribute('src') !== v) img.src = v;
    }
}

function fail(title, text) {
    const el = $('loadingState');
    const line = (tag, value, css) => Object.assign(document.createElement(tag), { textContent: value, style: css || '' });
    const back = Object.assign(document.createElement('a'), { href: '/blog.html', textContent: '← Back to the blog' });
    const nav = line('div', '', 'margin-top:1rem');
    nav.append(back);
    el.replaceChildren(line('div', title, 'color:var(--text);font-weight:600;margin-bottom:.5rem'), line('div', text), nav);
    el.hidden = false;
}

// Let analytics.js know the article is on the page (read-to-end and time spent).
function announce(id) {
    window.__nvPostReadyId = id;
    if (window.__nvPostReady) window.__nvPostReady(id);
}

const getJson = (url) => fetch(url).then((r) => {
    if (r.ok) return r.json();
    const e = new Error(`Firestore ${r.status}`); e.status = r.status; throw e;
});

if (s.moved) {
    // On its way to the post's static page.
} else if (s.preview) {
    // The admin console shows a draft here before it is published.
    document.head.append(Object.assign(document.createElement('meta'), { name: 'robots', content: 'noindex' }));
    addEventListener('message', (e) => {
        if (e.origin !== location.origin || e.data?.type !== 'blog-preview') return;
        const post = { id: 'preview', ...e.data.post };
        show(post);
        fillMedia(post);
    });
    parent.postMessage({ type: 'blog-preview-ready' }, location.origin);
} else if (!s.id) {
    fail('There is no post at this address.', 'The link may be incomplete.');
} else {
    const media = s.media || getJson(docUrl(s.id, MEDIA_FIELDS));
    media.catch(() => {});
    try {
        const post = fromRest(await (s.text || getJson(docUrl(s.id, TEXT_FIELDS))));
        show(post);
        announce(post.id);
    } catch (e) {
        if (e.status === 404) fail('This post isn’t here.', 'It may have been taken down.');
        else fail('The post didn’t load.', 'Check your connection and reload the page.');
    }
    try { fillMedia(fromRest(await media)); } catch { /* images are optional; the text is already up */ }
}
</script>
