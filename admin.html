<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Navajit D</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Inconsolata:wght@400;500;600;700&family=Tiro+Bangla&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --text: #0a1f00; --bg: #fff; --accent: #2563eb; --muted: #6b7280;
            --border: #e5e7eb; --bg-subtle: #f9fafb; --danger: #dc2626;
            --success: #16a34a; --font: "Inconsolata", monospace;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;padding:2rem 1.5rem;max-width:58rem;margin:0 auto}

        /* ─── Login Screen ─── */
        #loginScreen{display:flex;align-items:center;justify-content:center;min-height:80vh}
        .login-box{width:100%;max-width:22rem;border:1px solid var(--border);border-radius:10px;padding:2rem;text-align:center}
        .login-box h2{font-size:1.25rem;font-weight:700;margin-bottom:.5rem}
        .login-box p{font-size:.875rem;color:var(--muted);margin-bottom:1.5rem}
        .btn-google{background:#fff;color:#374151;border:1px solid var(--border);width:100%;justify-content:center;gap:.625rem}
        .btn-google:hover{border-color:#4285f4;color:#4285f4}

        /* ─── Header ─── */
        .admin-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.5rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
        .admin-header h1{font-size:1.25rem;font-weight:700}
        .user-badge{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:.75rem}

        /* ─── Tabs ─── */
        .tabs{display:flex;gap:.25rem;margin-bottom:2rem;border-bottom:1px solid var(--border)}
        .tab{padding:.625rem 1rem;font-size:.875rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);transition:all .2s}
        .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
        .tab:hover{color:var(--text)}
        .tab-panel{display:none} .tab-panel.active{display:block}

        /* ─── Forms ─── */
        label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem;color:var(--muted)}
        input[type=text],input[type=date],input[type=email],input[type=password],textarea,select{width:100%;padding:.625rem .75rem;border:1px solid var(--border);border-radius:6px;font-family:var(--font);font-size:.9375rem;color:var(--text);background:var(--bg);transition:border-color .2s;outline:none}
        input:focus,textarea:focus,select:focus{border-color:var(--accent)}
        textarea{resize:vertical;min-height:5rem}
        .form-row{margin-bottom:1.25rem}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        @media(max-width:500px){.form-grid{grid-template-columns:1fr}}

        /* ─── Drop Zone ─── */
        .drop-zone{border:2px dashed var(--border);border-radius:8px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted);font-size:.9375rem}
        .drop-zone:hover,.drop-zone.over{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.03)}
        .drop-zone input{display:none}
        .drop-zone strong{display:block;font-size:1rem;margin-bottom:.375rem;color:var(--text)}

        /* ─── Buttons ─── */
        .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:6px;border:none;cursor:pointer;font-family:var(--font);font-size:.9375rem;font-weight:600;transition:all .2s}
        .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:#1d4ed8}
        .btn-secondary{background:var(--bg-subtle);color:var(--text);border:1px solid var(--border)} .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
        .btn-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca} .btn-danger:hover{background:#fee2e2}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        a.btn{text-decoration:none}
        .btn-row{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap}

        /* ─── Preview ─── */
        .preview-box{border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-top:1rem;max-height:480px;overflow-y:auto;font-size:.875rem;line-height:1.7;color:var(--text)}
        .preview-box *{font-family:inherit}
        .preview-box[contenteditable="true"]{cursor:text}
        .preview-box[contenteditable="true"]:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);outline:none}
        .preview-label{font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:.5rem}

        /* ─── Post List ─── */
        .post-item{padding:1rem 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
        .post-item:last-child{border-bottom:none}
        .post-item-title{font-weight:600;font-size:.9375rem;margin-bottom:.25rem}
        .post-item-meta{font-size:.8125rem;color:var(--muted)}
        .post-item-actions{display:flex;gap:.5rem;flex-shrink:0}
        .btn-sm{padding:.375rem .75rem;font-size:.8125rem}

        /* ─── Alerts ─── */
        .alert{padding:.875rem 1rem;border-radius:6px;font-size:.875rem;margin-bottom:1rem;display:none}
        .alert.show{display:block}
        .alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
        .alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
        .alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

        /* ─── Spinner ─── */
        .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
        .spinner-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--accent)}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* ─── Metrics ─── */
        .mx-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end;margin-bottom:1.5rem}
        .mx-field{display:flex;flex-direction:column;gap:.25rem}
        .mx-field label{margin-bottom:0}
        .mx-field select{width:auto;min-width:8rem;padding:.4rem .6rem;font-size:.8125rem}
        .mx-status{font-size:.75rem;color:var(--muted);margin-left:auto;align-self:center}
        .mx-maint{display:flex;align-items:center;gap:.75rem;margin:0 0 1.5rem;flex-wrap:wrap}
        .mx-maint .mx-status{margin-left:0}
        .mx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.75rem;margin-bottom:2rem}
        .mx-card{border:1px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;user-select:none;transition:border-color .15s,box-shadow .15s,background .15s}
        .mx-card:hover{border-color:var(--accent)}
        .mx-card:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.25)}
        .mx-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:rgba(37,99,235,.04)}
        .mx-card .v{font-size:1.5rem;font-weight:700;line-height:1.1}
        .mx-card .l{font-size:.75rem;color:var(--muted);margin-top:.35rem}
        .mx-card .s{font-size:.7rem;color:var(--accent);margin-top:.25rem}
        .mx-section-title{font-size:.9375rem;font-weight:700;margin:1.5rem 0 .75rem}
        table.mx-table{width:100%;border-collapse:collapse;font-size:.8125rem}
        table.mx-table th,table.mx-table td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--border)}
        table.mx-table th{color:var(--muted);font-weight:600;white-space:nowrap}
        table.mx-table td.num,table.mx-table th.num{text-align:right;font-variant-numeric:tabular-nums}
        .mx-empty{padding:1.5rem;color:var(--muted);text-align:center;font-size:.8125rem}
        .mx-note{font-size:.75rem;color:var(--muted);margin-top:.5rem;line-height:1.5}

        /* ─── Visitor trends chart ─── */
        .mx-trend{margin-bottom:2rem}
        .mx-trend-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 .75rem}
        .mx-trend-head .mx-section-title{margin:0}
        .mx-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
        .mx-toggle button{padding:.35rem .85rem;font-size:.8125rem;font-family:var(--font);background:var(--bg);color:var(--muted);border:none;border-left:1px solid var(--border);cursor:pointer;transition:all .15s}
        .mx-toggle button:first-child{border-left:none}
        .mx-toggle button:hover{color:var(--text)}
        .mx-toggle button.active{background:var(--accent);color:#fff;font-weight:600}
        .mx-chart{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:8px;padding:.25rem}
        .mx-chart .grid{stroke:var(--border);stroke-width:1}
        .mx-chart .axis-text{fill:var(--muted);font-size:11px;font-family:var(--font)}
        .mx-chart .area{fill:var(--accent);opacity:.08}
        .mx-chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
        .mx-chart .dot{fill:var(--accent);cursor:pointer;transition:r .12s}
        .mx-chart .dot:hover{r:5}

        /* ─── Recipe images & size meter ─── */
        .drop-zone.sm{padding:1.5rem}
        .img-grid{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.75rem}
        .img-thumb{position:relative;width:5.5rem;height:5.5rem;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg-subtle)}
        .img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
        .img-thumb button{position:absolute;top:2px;right:2px;width:1.25rem;height:1.25rem;padding:0;border:none;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:.7rem;line-height:1;display:flex;align-items:center;justify-content:center}
        .img-thumb button:hover{background:var(--danger)}
        .img-thumb.hero::after{content:"HERO";position:absolute;bottom:0;left:0;right:0;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-align:center;background:var(--accent);color:#fff}
        .size-meter{font-size:.75rem;color:var(--muted);margin-top:1rem}
        .size-meter .bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:.4rem;max-width:24rem}
        .size-meter .bar i{display:block;height:100%;width:0;background:var(--success);transition:width .2s,background .2s}
        .size-meter.warn .bar i{background:#d97706}
        .size-meter.over{color:var(--danger);font-weight:600}
        .size-meter.over .bar i{background:var(--danger)}

        /* ─── Blog posts editor ─── */
        .bl-toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
        .bl-filters{display:flex;flex-wrap:wrap;gap:.375rem}
        .bl-chip{display:inline-flex;align-items:center;gap:.375rem;padding:.3rem .7rem;border:1px solid var(--border);border-radius:999px;background:var(--bg);font-family:var(--font);font-size:.8125rem;color:var(--muted);cursor:pointer}
        .bl-chip:hover{color:var(--text);border-color:var(--accent)}
        .bl-chip.is-on{color:var(--accent);border-color:var(--accent);font-weight:600}
        .bl-count{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
        .bl-notice a{color:inherit;font-weight:600}
        .bl-notice .bl-link{color:inherit;font-weight:600}
        .bl-spin{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:.4rem}
        .bl-list .post-item-title:lang(bn){font-family:"Tiro Bangla",var(--font)}
        .bl-list .post-item-title:lang(hi){font-family:"Tiro Devanagari Hindi",var(--font)}
        .bl-row-main{min-width:0}
        .bl-editor-title{font-size:.9375rem}
        .bl-seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden}
        .bl-seg-item{margin:0;display:block;font-size:.875rem;font-weight:600;color:var(--muted);cursor:pointer}
        .bl-seg-item input{position:absolute;opacity:0;pointer-events:none}
        .bl-seg-item span{display:block;padding:.5rem 1rem;border-left:1px solid var(--border)}
        .bl-seg-item:first-child span{border-left:none}
        .bl-seg-item input:checked+span{background:var(--accent);color:#fff}
        .bl-seg-item input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-4px}
        .bl-grid-3{grid-template-columns:2fr 1fr 1fr}
        @media(max-width:700px){.bl-grid-3{grid-template-columns:1fr}}
        .bl-prose{min-height:14rem;max-height:32rem;margin-top:.75rem}
        .bl-poem{font-family:"EB Garamond",Georgia,serif;font-size:1.125rem;line-height:1.6;min-height:18rem}
        .bl-poem:lang(bn){font-family:"Tiro Bangla",Georgia,serif}
        .bl-poem:lang(hi){font-family:"Tiro Devanagari Hindi",Georgia,serif}
        .bl-restored{font-size:.8125rem;color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:.625rem .875rem;margin-bottom:1rem}
        .bl-link{background:none;border:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}

        /* ─── Experience editor ─── */
        .xp-intro{font-size:.875rem;color:var(--muted);line-height:1.6;margin-bottom:1rem;max-width:46rem}
        .xp-connect{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap;font-size:.8125rem;color:var(--muted);padding:.625rem .875rem;border:1px solid var(--border);border-radius:8px;margin-bottom:1rem}
        .xp-connect .btn{margin-left:auto}
        .xp-dot{width:.5rem;height:.5rem;border-radius:50%;background:#d1d5db;flex:none}
        .xp-dot.is-on{background:var(--success)}
        .xp-toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding:.625rem 0;margin-bottom:1rem;border-bottom:1px solid var(--border)}
        .xp-spacer{flex:1}
        .xp-status{font-size:.8125rem;color:var(--muted)}
        .xp-alert{margin:0 0 1rem}
        .xp-roles{display:grid;gap:1rem}
        .xp-role{border:1px solid var(--border);border-radius:10px;padding:1rem 1.125rem}
        .xp-role.is-archived{background:var(--bg-subtle)}
        .xp-role.is-archived .xp-role-title{color:var(--muted)}
        .xp-item{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
        .xp-item-main{min-width:0}
        .xp-role-title{font-weight:700;font-size:1rem}
        .xp-item-title{font-weight:600;font-size:.875rem}
        .xp-item-meta{font-size:.8125rem;color:var(--muted);margin-top:.2rem}
        .xp-actions{display:flex;gap:.375rem;flex:none}
        .xp-actions .btn{padding:.3rem .6rem}
        .xp-actions .xp-archive:hover{border-color:var(--danger);color:var(--danger)}
        .xp-cards{list-style:none;margin:.875rem 0 .75rem;border-top:1px solid var(--border)}
        .xp-cards>.xp-item{padding:.625rem 0;border-bottom:1px solid var(--border)}
        .xp-item.is-archived .xp-item-main{opacity:.55}
        .xp-badge{display:inline-block;margin-left:.5rem;padding:.05rem .45rem;border:1px solid var(--border);border-radius:999px;background:var(--bg);font-size:.6875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);vertical-align:.1em}
        .xp-muted{font-size:.8125rem;color:var(--muted);margin:.75rem 0}
        .xp-loading{display:flex;align-items:center;gap:.75rem;color:var(--muted);padding:2rem 0}
        .xp-dialog{width:min(56rem,94vw);max-height:92vh;margin:auto;padding:0;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font)}
        .xp-dialog::backdrop{background:rgba(15,23,42,.35)}
        .xp-form{padding:1.5rem}
        .xp-form p{font-size:.875rem;line-height:1.6;margin-bottom:.75rem}
        .xp-form code{font-family:var(--font);font-size:.875rem;background:var(--bg-subtle);padding:0 .25rem;border-radius:3px}
        .xp-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
        .xp-dialog-head h3{font-size:1.0625rem}
        .xp-tri-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;align-items:start}
        @media(max-width:700px){.xp-tri-grid,.xp-values-grid{grid-template-columns:1fr}}
        .xp-lang{display:flex;flex-direction:column;gap:.25rem;min-width:0}
        .xp-lang-tag{display:block;height:1.125rem;font-size:.6875rem;line-height:1.125rem;color:var(--muted);overflow:hidden}
        .xp-lang textarea{min-height:3.5rem;resize:vertical;overflow:hidden;line-height:1.6}
        .xp-lang input:lang(bn),.xp-lang input:lang(hi),.xp-lang textarea:lang(bn),.xp-lang textarea:lang(hi){font-family:system-ui,sans-serif;font-size:.875rem}
        .xp-lang-note{margin:-.75rem 0 1.25rem}
        .xp-hint{font-size:.75rem;color:var(--muted);margin-top:.375rem;line-height:1.5}
        .xp-warn{font-size:.75rem;color:#b45309}
        .xp-values-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
        .xp-to{display:flex;align-items:center;gap:.75rem}
        label.xp-check{display:flex;align-items:center;gap:.5rem;margin:0 0 1.25rem;font-size:.875rem;font-weight:400;color:var(--text)}
        .xp-to label.xp-check{margin:0;white-space:nowrap}
        .xp-check input{width:auto}
        .xp-section-label{font-size:.8125rem;font-weight:700;margin:.25rem 0 .75rem}
        .xp-bullet{border-left:2px solid var(--border);padding-left:.875rem;margin-bottom:1rem}
        .xp-bullet .form-row{margin-bottom:.5rem}
        .xp-errors{font-size:.8125rem;color:var(--danger);line-height:1.5}
        .xp-errors ul{margin:.375rem 0 0 1.25rem}
        .xp-steps{margin:.25rem 0 1rem 1.25rem;font-size:.875rem;line-height:1.7}
        .xp-preview{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(15,23,42,.45)}
        .xp-preview-bar{display:flex;align-items:center;gap:1rem;padding:.625rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);font-size:.875rem}
        .xp-preview-stage{flex:1;display:flex;justify-content:center;background:var(--bg-subtle);overflow:hidden}
        .xp-frame{width:100%;height:100%;border:0;background:#fff;box-shadow:0 0 0 1px var(--border)}

        /* ─── Jobs ─── */
        .jb-day{width:auto;padding:.4rem .6rem;font-size:.8125rem}
        .jb-funnel{font-size:.8125rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.6}
        .jb-funnel summary{cursor:pointer}
        .jb-sources{display:flex;flex-wrap:wrap;gap:.25rem .875rem;margin:.5rem 0}
        .jb-list{display:grid;gap:1rem}
        .jb-job{border:1px solid var(--border);border-radius:10px;padding:1rem 1.125rem}
        .jb-job.is-applied{border-color:#bbf7d0;background:#f7fef9}
        .jb-job.is-skipped{background:var(--bg-subtle)}
        .jb-job.is-skipped .jb-job-head,.jb-job.is-skipped .jb-why,.jb-job.is-skipped .jb-gap{opacity:.55}
        .jb-job-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
        .jb-job-main{min-width:0}
        .jb-title{font-size:1rem;font-weight:700;line-height:1.4}
        .jb-title a{color:var(--text);text-decoration:none}
        .jb-title a:hover{color:var(--accent);text-decoration:underline}
        .jb-rank{color:var(--muted);font-weight:400}
        .jb-meta{font-size:.8125rem;color:var(--muted);margin-top:.2rem;line-height:1.5}
        .jb-meta a{color:var(--muted)}
        .jb-score{flex:none;min-width:2.75rem;text-align:center;font-size:1.25rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;padding:.375rem .5rem;border:1px solid var(--border);border-radius:8px}
        .jb-score-note{display:block;font-size:.625rem;font-weight:400;color:var(--muted)}
        .jb-why{margin:.75rem 0 0 1.125rem;font-size:.875rem;line-height:1.6}
        .jb-gap{font-size:.875rem;line-height:1.6;margin-top:.375rem;color:#92400e}
        .jb-desc{margin-top:.625rem;font-size:.8125rem}
        .jb-desc summary{cursor:pointer;color:var(--muted)}
        .jb-desc-text{white-space:pre-wrap;line-height:1.6;max-height:22rem;overflow-y:auto;margin-top:.5rem;padding:.75rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-subtle)}
        .jb-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.875rem}
        .jb-actions .btn.is-on{border-color:var(--success);color:var(--success)}
        .jb-draft{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
        .jb-wait{padding:.5rem 0;font-size:.875rem}
        .jb-draft-head{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;font-size:.875rem}
        .jb-count{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}

<script>
// ─── Firebase Config ──────────────────────────────────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyCM8XiZ9tLn7jtVNcx0D6iZwYOGXBOLdjU",
    authDomain: "recipes-7dc22.firebaseapp.com",
    projectId: "recipes-7dc22",
    storageBucket: "recipes-7dc22.firebasestorage.app",
    messagingSenderId: "631868594925",
    appId: "1:631868594925:web:929dc5fe91253e7a0f4ae4"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ALLOWED_EMAIL = 'navjitdebnath5@gmail.com';

// ─── Auth ─────────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(user => {
    if (user && user.email === ALLOWED_EMAIL) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminApp').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        loadMetrics();   // default tab
    } else {
        if (user) { auth.signOut(); showAlert(document.getElementById('loginError'), 'Access restricted to ' + ALLOWED_EMAIL); }
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminApp').style.display = 'none';
    }
});

document.getElementById('loginBtn').addEventListener('click', async () => {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    document.getElementById('loginBtnText').textContent = 'Signing in…';
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ login_hint: ALLOWED_EMAIL });
        await auth.signInWithPopup(provider);
    } catch(e) {
        showAlert(document.getElementById('loginError'), e.message);
        btn.disabled = false;
        document.getElementById('loginBtnText').textContent = 'Sign in with Google';
    }
});
document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

// ─── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
        if (tab.dataset.tab === 'blog' && window.blogAdminOpen) window.blogAdminOpen();
        if (tab.dataset.tab === 'metrics' && !mxLoaded) loadMetrics();
        if (tab.dataset.tab === 'experience' && window.xpAdminOpen) window.xpAdminOpen();
        if (tab.dataset.tab === 'jobs' && window.jobsAdminOpen) window.jobsAdminOpen();
    });
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showAlert(el, msg) { el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 6000); }
function readTime(text) { return Math.max(1, Math.round(text.split(/\s+/).filter(Boolean).length / 200)) + ' min read'; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function fmtBytes(b) { return b > 1e6 ? (b/1e6).toFixed(1) + ' MB' : Math.round(b/1024) + ' KB'; }

// ════════════════════════════════════════════════════════════════════════════
//  METRICS
// ════════════════════════════════════════════════════════════════════════════
let mxRaw = [];          // raw events in the current window (in-memory cache)
let mxLoaded = false;
let mxPostTitles = {};   // id -> title (read from Firestore)

const mxWindowSel  = document.getElementById('mxWindow');
const mxOsSel      = document.getElementById('mxOs');
const mxDeviceSel  = document.getElementById('mxDevice');
const mxBrowserSel = document.getElementById('mxBrowser');
const mxCountrySel = document.getElementById('mxCountry');

document.getElementById('mxRefresh').addEventListener('click', () => loadMetrics(true));
mxWindowSel.addEventListener('change', () => loadMetrics(true));     // window changes the query → refetch
[mxOsSel, mxDeviceSel, mxBrowserSel, mxCountrySel].forEach(s => s.addEventListener('change', renderMetrics)); // client-side

function pct(arr, p) {
    if (!arr.length) return 0;
    const s = arr.slice().sort((a, b) => a - b);
    const rank = Math.ceil((p / 100) * s.length);
    return s[Math.min(s.length, Math.max(1, rank)) - 1];
}
function fmtDur(ms) {
    if (!ms || ms < 0) return '0s';
    const sec = Math.round(ms / 1000);
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60), r = sec % 60;
    return m + 'm' + (r ? ' ' + r + 's' : '');
}
function setOptions(sel, values) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">All</option>' + values.map(v => `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
    if (values.includes(cur)) sel.value = cur;
}
function distinct(events, key) {
    return Array.from(new Set(events.map(e => e[key]).filter(Boolean))).sort();
}

async function loadMetrics(force) {
    if (mxLoaded && !force) return;
    const bodyEl = document.getElementById('mxBody');
    document.getElementById('mxError').classList.remove('show');
    bodyEl.innerHTML = '<div class="mx-empty"><div class="spinner spinner-dark" style="margin:0 auto .75rem"></div>Loading metrics…</div>';
    document.getElementById('mxStatus').textContent = '';

    // Load post titles once (best-effort) for nicer labels.
    if (!Object.keys(mxPostTitles).length) {
        try {
            // Listing posts needs the owner's sign-in (firestore.rules).
            const idToken = await auth.currentUser.getIdToken();
            const r = await fetch('https://firestore.googleapis.com/v1/projects/' + firebaseConfig.projectId + '/databases/(default)/documents/posts?key=' + firebaseConfig.apiKey + '&pageSize=300&mask.fieldPaths=title', { headers: { Authorization: 'Bearer ' + idToken } });
            if (r.ok) { ((await r.json()).documents || []).forEach(d => { mxPostTitles[d.name.split('/').pop()] = d.fields?.title?.stringValue || ''; }); }
        } catch (e) {}
    }

    try {
        let q = db.collection('analytics_events');
        const win = mxWindowSel.value;
        if (win !== 'all') {
            const cutoff = new Date(Date.now() - parseInt(win, 10) * 86400000).toISOString();
            q = q.where('ts', '>=', cutoff);
        }
        // Bound the read so the admin tab stays fast regardless of total volume.
        // Firestore caps a single query's limit at 10000, so page through with a
        // cursor up to an overall ceiling rather than asking for 50000 at once.
        const PAGE = 10000, MAX_EVENTS = 50000;
        const baseQ = q.orderBy('ts', 'desc');
        mxRaw = [];
        let cursor = null;
        while (mxRaw.length < MAX_EVENTS) {
            let pageQ = baseQ.limit(PAGE);
            if (cursor) pageQ = pageQ.startAfter(cursor);
            const snap = await pageQ.get();
            if (snap.empty) break;
            mxRaw.push(...snap.docs.map(d => d.data()));
            cursor = snap.docs[snap.docs.length - 1];
            if (snap.docs.length < PAGE) break;   // last page
        }
        mxLoaded = true;

        // Populate segment filters from the full loaded set.
        setOptions(mxOsSel, distinct(mxRaw, 'os'));
        setOptions(mxDeviceSel, distinct(mxRaw, 'device'));
        setOptions(mxBrowserSel, distinct(mxRaw, 'browser'));
        const countries = distinct(mxRaw, 'country');
        if (mxRaw.some(e => !e.country)) countries.push('NA');   // bucket for events with no geo
        setOptions(mxCountrySel, countries);

        renderMetrics();
    } catch (e) {
        bodyEl.innerHTML = '';
        showAlert(document.getElementById('mxError'), 'Failed to load metrics: ' + e.message);
    }
}

function applyFilters() {
    const os = mxOsSel.value, dev = mxDeviceSel.value, br = mxBrowserSel.value, c = mxCountrySel.value;
    return mxRaw.filter(e =>
        (!os || e.os === os) && (!dev || e.device === dev) &&
        (!br || e.browser === br) &&
        (!c || (c === 'NA' ? !e.country : e.country === c)));   // NA = events with no geo
}

function renderMetrics() {
    if (!mxLoaded) return;
    const ev = applyFilters();
    const byType = t => ev.filter(e => e.type === t);
    const u = es => new Set(es.map(e => e.vid)).size;             // unique individuals
    const pv = byType('page_view');
    const pvPage = pg => pv.filter(e => e.page === pg);

    const leads = u(byType('resume_email_lead'));

    // Cards are clickable: selecting one re-plots the trend chart for that metric.
    const cards = MX_CARDS.map(def => ({
        key: def.key, l: def.label,
        v: u(ev.filter(def.match)),
        s: def.key === 'visitors' ? pv.length + ' views'
         : def.key === 'resumeDl' ? leads + ' left email' : ''
    }));

    // CTA breakdown (projects page)
    const ctaMap = {};
    byType('cta_click').forEach(e => {
        const key = (e.project || '?') + ' ‹ ' + (e.label || '?');
        const c = ctaMap[key] || (ctaMap[key] = { project: e.project || '?', label: e.label || '?', clickers: new Set(), total: 0 });
        c.clickers.add(e.vid); c.total++;
    });
    const ctas = Object.values(ctaMap).map(c => ({ project: c.project, label: c.label, clickers: c.clickers.size, total: c.total }))
        .sort((a, b) => b.clickers - a.clickers);

    // Traffic sources — utm_source (e.g. willyou.web.app) wins, else referrer host, else Direct.
    const srcOf = e => (e.src || e.ref || 'Direct');
    function sources(list) {
        const m = {};
        list.forEach(e => { const k = srcOf(e); const s = m[k] || (m[k] = { src: k, ind: new Set(), views: 0 }); s.ind.add(e.vid); s.views++; });
        return Object.values(m).map(s => ({ src: s.src, ind: s.ind.size, views: s.views })).sort((a, b) => b.ind - a.ind);
    }
    const srcProjects = sources(pvPage('projects'));
    const srcAll = sources(pv);
    const srcTable = rows => '<table class="mx-table"><thead><tr><th>Source</th><th class="num">Individuals</th><th class="num">Views</th></tr></thead><tbody>'
        + rows.map(s => `<tr><td>${escHtml(s.src)}</td><td class="num">${s.ind}</td><td class="num">${s.views}</td></tr>`).join('') + '</tbody></table>';

    // Per-post engagement
    const postMap = {};
    const P = id => postMap[id] || (postMap[id] = { openers: new Set(), reads: new Set(), dwell: [] });
    pvPage('blog_post').forEach(e => { if (e.postId) P(e.postId).openers.add(e.vid); });
    byType('post_read_end').forEach(e => { if (e.postId) P(e.postId).reads.add(e.vid); });
    byType('post_dwell').forEach(e => { if (e.postId && typeof e.ms === 'number') P(e.postId).dwell.push(e.ms); });
    const posts = Object.entries(postMap).map(([id, p]) => ({
        id, title: mxPostTitles[id] || id,
        opens: p.openers.size, reads: p.reads.size,
        completion: p.openers.size ? Math.round(100 * p.reads.size / p.openers.size) : 0,
        p50: pct(p.dwell, 50), p90: pct(p.dwell, 90), p99: pct(p.dwell, 99), n: p.dwell.length
    })).sort((a, b) => b.opens - a.opens);

    // ── Render ──
    let html = '<div class="mx-trend" id="mxTrend"></div>';
    html += '<div class="mx-cards">' + cards.map(c =>
        `<div class="mx-card${c.key === mxCardSel ? ' selected' : ''}" data-card="${c.key}" role="button" tabindex="0" aria-pressed="${c.key === mxCardSel}"><div class="v">${c.v.toLocaleString('en-IN')}</div><div class="l">${c.l}</div>${c.s ? `<div class="s">${c.s}</div>` : ''}</div>`
    ).join('') + '</div>';

    html += '<div class="mx-section-title">CTA clicks — Projects page</div>';
    html += ctas.length
        ? '<table class="mx-table"><thead><tr><th>Project</th><th>CTA</th><th class="num">Individuals</th><th class="num">Total clicks</th></tr></thead><tbody>'
            + ctas.map(c => `<tr><td>${escHtml(c.project)}</td><td>${escHtml(c.label)}</td><td class="num">${c.clickers}</td><td class="num">${c.total}</td></tr>`).join('')
            + '</tbody></table>'
        : '<div class="mx-empty">No CTA clicks in this range.</div>';

    html += '<div class="mx-section-title">Traffic sources — Projects page</div>';
    html += srcProjects.length ? srcTable(srcProjects) : '<div class="mx-empty">No projects-page views in this range.</div>';
    html += '<div class="mx-section-title">Traffic sources — all pages</div>';
    html += srcAll.length ? srcTable(srcAll) : '<div class="mx-empty">No page views in this range.</div>';

    html += '<div class="mx-section-title">Blog posts — opens, completion & time on page</div>';
    html += posts.length
        ? '<table class="mx-table"><thead><tr><th>Post</th><th class="num">Opens</th><th class="num">Read to end</th><th class="num">Completion</th><th class="num">p50</th><th class="num">p90</th><th class="num">p99</th></tr></thead><tbody>'
            + posts.map(p => `<tr><td>${escHtml(p.title)}</td><td class="num">${p.opens}</td><td class="num">${p.reads}</td><td class="num">${p.completion}%</td><td class="num">${fmtDur(p.p50)}</td><td class="num">${fmtDur(p.p90)}</td><td class="num">${fmtDur(p.p99)}</td></tr>`).join('')
            + '</tbody></table>'
            + '<div class="mx-note">Completion = unique readers who hit the end ÷ unique openers. p50/p90/p99 are percentiles of active time on the page (foreground only).</div>'
        : '<div class="mx-empty">No blog-post activity in this range.</div>';

    document.getElementById('mxBody').innerHTML = html;
    renderTrend();

    // Clicking a card toggles it as the trend chart's metric (re-click to clear).
    document.querySelectorAll('.mx-card[data-card]').forEach(card => {
        const toggle = () => {
            const k = card.dataset.card;
            mxCardSel = (mxCardSel === k) ? null : k;
            document.querySelectorAll('.mx-card[data-card]').forEach(c => {
                const on = c.dataset.card === mxCardSel;
                c.classList.toggle('selected', on);
                c.setAttribute('aria-pressed', on);
            });
            renderTrend();
        };
        card.addEventListener('click', toggle);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });

    document.getElementById('mxStatus').textContent =
        `${ev.length.toLocaleString('en-IN')} events · loaded ${new Date().toLocaleTimeString('en-IN')}`;
}

// ─── Visitor trends (daily / weekly / monthly) ─────────────────────────────────
let mxTrend = 'daily';
let mxCardSel = null;   // selected metric-card key (null = default Site-visitors trend)

// Each card maps to the event predicate that defines its metric, so the same
// definition drives both the card's number and the trend chart it plots.
const MX_CARDS = [
    { key: 'visitors',   label: 'Site visitors',     match: e => e.type === 'page_view' },
    { key: 'projects',   label: 'Projects page',     match: e => e.type === 'page_view' && e.page === 'projects' },
    { key: 'experience', label: 'Experience clicks', match: e => e.type === 'experience_click' },
    { key: 'resumeView', label: 'Résumé views',      match: e => e.type === 'resume_view' },
    { key: 'resumeDl',   label: 'Résumé downloads',  match: e => e.type === 'resume_download' },
    { key: 'blogList',   label: 'Blog list views',   match: e => e.type === 'page_view' && e.page === 'blog_list' },
];

function mxLocalYMD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function mxStartOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; } // Monday
function mxBucketStart(d, gran) {
    if (gran === 'monthly') return new Date(d.getFullYear(), d.getMonth(), 1);
    if (gran === 'weekly')  return mxStartOfWeek(d);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function mxBucketKey(d, gran) {
    if (gran === 'monthly') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    return mxLocalYMD(mxBucketStart(d, gran));
}
function mxBucketNext(d, gran) {
    if (gran === 'monthly') return new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const x = new Date(d); x.setDate(x.getDate() + (gran === 'weekly' ? 7 : 1)); return x;
}
function mxBucketLabel(d, gran) {
    return gran === 'monthly'
        ? d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' })
        : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}
// Pick an integer tick step so gridlines land on whole values (visitor counts
// are integers) and the axis top is a multiple of that step.
function mxNiceAxis(maxV) {
    maxV = Math.max(1, maxV);
    const rawStep = maxV / 4;
    const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
    let step = [1, 2, 5, 10].map(m => m * pow).find(c => c >= rawStep) || 10 * pow;
    step = Math.max(1, Math.ceil(step));            // whole-number steps only
    return { yMax: Math.ceil(maxV / step) * step, step };
}

// Bucket page_view events into a continuous time series of unique visitors.
function buildTrend(events, gran, match) {
    const sel = events.filter(e => match(e) && e.ts);
    const map = new Map();   // key -> { start, visitors:Set, views }
    let minD = null, maxD = null;
    sel.forEach(e => {
        const d = new Date(e.ts);
        if (isNaN(d)) return;
        if (!minD || d < minD) minD = d;
        if (!maxD || d > maxD) maxD = d;
        const key = mxBucketKey(d, gran);
        let b = map.get(key);
        if (!b) { b = { start: mxBucketStart(d, gran), visitors: new Set(), views: 0 }; map.set(key, b); }
        if (e.vid) b.visitors.add(e.vid);
        b.views++;
    });
    if (!minD) return [];
    const out = [];
    let cur = mxBucketStart(minD, gran);
    const end = mxBucketStart(maxD, gran);
    let guard = 0;
    while (cur <= end && guard++ < 3000) {
        const b = map.get(mxBucketKey(cur, gran));
        out.push({ label: mxBucketLabel(cur, gran), visitors: b ? b.visitors.size : 0, views: b ? b.views : 0 });
        cur = mxBucketNext(cur, gran);
    }
    return out;
}

function trendSvg(buckets) {
    const W = 820, H = 260, padL = 42, padR = 16, padT = 16, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = buckets.length;
    const { yMax, step: yStep } = mxNiceAxis(Math.max(...buckets.map(b => b.visitors), 1));
    const x = i => padL + (n <= 1 ? innerW / 2 : innerW * i / (n - 1));
    const y = v => padT + innerH - (v / yMax) * innerH;
    const base = padT + innerH;

    let grid = '', yl = '';
    for (let val = 0; val <= yMax; val += yStep) {
        const yy = y(val);
        grid += `<line class="grid" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}"/>`;
        yl   += `<text class="axis-text" x="${padL - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${val}</text>`;
    }

    const pts = buckets.map((b, i) => [x(i), y(b.visitors)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = `${line} L${x(n - 1).toFixed(1)} ${base} L${x(0).toFixed(1)} ${base} Z`;

    const step = Math.max(1, Math.ceil(n / 8));
    let xt = '';
    buckets.forEach((b, i) => {
        if (i % step === 0 || i === n - 1)
            xt += `<text class="axis-text" x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${escHtml(b.label)}</text>`;
    });

    let dots = '';
    if (n <= 45) dots = buckets.map((b, i) =>
        `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(b.visitors).toFixed(1)}" r="3"><title>${escHtml(b.label)}: ${b.visitors} unique · ${b.views} total</title></circle>`).join('');

    return `<svg class="mx-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Visitor trend chart">`
        + grid + `<path class="area" d="${area}"/><path class="line" d="${line}"/>` + dots + yl + xt + '</svg>';
}

function renderTrend() {
    const wrap = document.getElementById('mxTrend');
    if (!wrap) return;
    const def = MX_CARDS.find(c => c.key === mxCardSel) || MX_CARDS[0];   // default: Site visitors
    const buckets = buildTrend(applyFilters(), mxTrend, def.match);
    const toggle = ['daily', 'weekly', 'monthly'].map(g =>
        `<button data-gran="${g}" class="${g === mxTrend ? 'active' : ''}">${g[0].toUpperCase() + g.slice(1)}</button>`).join('');
    const title = mxCardSel ? escHtml(def.label) + ' — trend' : 'Visitor trends';
    const head = `<div class="mx-trend-head"><div class="mx-section-title">${title}</div><div class="mx-toggle">${toggle}</div></div>`;
    const unit = mxTrend === 'daily' ? 'day' : mxTrend === 'weekly' ? 'week' : 'month';
    const noun = mxCardSel ? 'individuals' : 'visitors';
    const hint = mxCardSel ? ` Filtered to ‹${escHtml(def.label)}› — click the card again to reset.` : '';
    wrap.innerHTML = head + (buckets.length
        ? trendSvg(buckets) + `<div class="mx-note">Unique ${noun} per ${unit}. Hover a point for exact counts.${hint}</div>`
        : '<div class="mx-empty">No activity in this range.</div>');
    wrap.querySelectorAll('.mx-toggle button').forEach(b =>
        b.addEventListener('click', () => { mxTrend = b.dataset.gran; renderTrend(); }));
}

// ════════════════════════════════════════════════════════════════════════════
//  GEO BACKFILL — resolve country for past events that logged an IP but no geo
// ════════════════════════════════════════════════════════════════════════════
// Looks up specific IPs (not the caller's) over HTTPS+CORS with no API key:
//   • geojs.io supports comma-separated batch lookups → primary, few requests
//   • ipwho.is / ipapi.co per-IP fallbacks for anything geojs can't resolve
async function lookupIPs(ips, onProgress) {
    const out = new Map();   // ip -> { country, cc, city, region }

    // Primary: geojs batch — many IPs per request.
    for (let i = 0; i < ips.length; i += 50) {
        const chunk = ips.slice(i, i + 50);
        try {
            const r = await fetch('https://get.geojs.io/v1/ip/geo.json?ip=' + chunk.map(encodeURIComponent).join(','));
            if (r.ok) {
                const data = await r.json();
                (Array.isArray(data) ? data : [data]).forEach(d => {
                    if (d && d.ip && d.country)
                        out.set(d.ip, { country: d.country, cc: d.country_code, city: d.city, region: d.region });
                });
            }
        } catch (e) {}
        if (onProgress) onProgress(Math.min(ips.length, i + 50), ips.length);
    }

    // Fallback per-IP for any the batch couldn't resolve.
    for (const ip of ips) {
        if (out.has(ip)) continue;
        let g = null;
        try {
            const r = await fetch('https://ipwho.is/' + encodeURIComponent(ip) + '?fields=success,country,country_code,city,region');
            if (r.ok) { const d = await r.json(); if (d && d.success !== false && d.country) g = { country: d.country, cc: d.country_code, city: d.city, region: d.region }; }
        } catch (e) {}
        if (!g) {
            try {
                const r = await fetch('https://ipapi.co/' + encodeURIComponent(ip) + '/json/');
                if (r.ok) { const d = await r.json(); if (d && !d.error && d.country_name) g = { country: d.country_name, cc: d.country_code, city: d.city, region: d.region }; }
            } catch (e) {}
        }
        if (g) out.set(ip, g);
        await new Promise(res => setTimeout(res, 250));   // be polite to the free fallbacks
    }
    return out;
}

async function runBackfill() {
    const btn = document.getElementById('mxBackfill');
    const status = document.getElementById('mxBackfillStatus');
    btn.disabled = true;
    status.textContent = 'Scanning events…';
    try {
        // 1. Page through all events; collect those with an IP but no country.
        const targets = [];          // { id, ip }
        const ipSet = new Set();
        const PAGE = 10000;
        const baseQ = db.collection('analytics_events').orderBy('ts', 'desc');
        let cursor = null;
        while (true) {
            let pageQ = baseQ.limit(PAGE);
            if (cursor) pageQ = pageQ.startAfter(cursor);
            const snap = await pageQ.get();
            if (snap.empty) break;
            snap.docs.forEach(doc => {
                const d = doc.data();
                if (d.ip && !d.country) { targets.push({ id: doc.id, ip: d.ip }); ipSet.add(d.ip); }
            });
            cursor = snap.docs[snap.docs.length - 1];
            if (snap.docs.length < PAGE) break;
        }
        if (!targets.length) { status.textContent = 'Nothing to backfill — every event with an IP already has a country.'; return; }

        // 2. Resolve each unique IP → country.
        status.textContent = `Resolving ${ipSet.size} unique IP(s)…`;
        const geo = await lookupIPs(Array.from(ipSet),
            (done, total) => { status.textContent = `Resolving IPs… ${done}/${total}`; });

        // 3. Write country onto each matching event (batched, ≤450 ops/commit).
        let written = 0, batch = db.batch(), ops = 0;
        for (const t of targets) {
            const g = geo.get(t.ip);
            if (!g) continue;
            const upd = { country: g.country, geoBackfilled: true };
            if (g.cc) upd.cc = g.cc;
            if (g.city) upd.city = g.city;
            if (g.region) upd.region = g.region;
            batch.update(db.collection('analytics_events').doc(t.id), upd);
            written++; ops++;
            if (ops === 450) { await batch.commit(); batch = db.batch(); ops = 0; }
        }
        if (ops) await batch.commit();

        const unresolved = targets.length - written;
        status.textContent = `Backfilled ${written} event(s) from ${geo.size} IP(s).` + (unresolved ? ` ${unresolved} still unresolved.` : '');
        mxLoaded = false; loadMetrics(true);   // reload so the new countries appear in the filter & chart
    } catch (e) {
        status.textContent = 'Backfill failed: ' + e.message;
    } finally {
        btn.disabled = false;
    }
}
document.getElementById('mxBackfill').addEventListener('click', runBackfill);
